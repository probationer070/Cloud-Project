<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Portfolio - P1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      margin: 0.5rem;
      font-size: 0.9rem;
    }
    .status {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(0,255,100,0.1);
      border: 1px solid rgba(0,255,100,0.3);
      border-radius: 8px;
      color: #00ff64;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Cloud Portfolio</h1>
    <p style="font-size:1.2rem; opacity:0.8; margin-bottom:2rem">
      Project 1: Security/Performance Optimized Static Website Hosting
    </p>
    <div>
      <span class="badge">☁️ S3 Hosting</span>
      <span class="badge">⚡ CloudFront CDN</span>
      <span class="badge">🔒 WAF Protection</span>
      <span class="badge">🔐 HTTPS</span>
      <span class="badge">📊 CloudWatch</span>
    </div>
    <div class="status">
      ✅ Deployment Successful! Serving globally from edge locations
    </div>
  </div>
</body>
</html>
